name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.8.9"

      - name: Synchronize the locked environment
        run: uv sync --frozen --extra dev

      - name: Check the lock file
        run: uv lock --check

      - name: Check lint
        run: uv run --frozen ruff check pyproject.toml src tests

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests

      - name: Check types
        run: uv run --frozen ty check

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git diff --check
          zero_sha=0000000000000000000000000000000000000000
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero_sha" ]; then
            git diff --check "${BEFORE_SHA}..HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Run the deterministic CPU suite
        env:
          MPLCONFIGDIR: /tmp/ptyrodactyl-mpl
        run: uv run --frozen pytest -q -n 0

      - name: Build documentation with warnings as errors
        if: matrix.python-version == '3.13'
        run: >-
          uv run --frozen sphinx-build -a -E -W -b html
          docs/source docs/build/html
